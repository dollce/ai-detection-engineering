# Patronus Agent Configuration
# Codex CLI integration:
#   Agents invoke `codex exec` for isolated reasoning tasks.
#   Codex CLI >= 0.163.0 and an authenticated `codex login` session are required.
#   model: null uses the CLI built-in default; CODEX_MODEL overrides per-agent models.
#   Set a concrete Codex model ID per agent to pin a model explicitly.
#   User/project CLI config, repository instructions, shell, MCP, and app tools are
#   excluded from these inference calls. Interactive `codex` still reads AGENTS.md.
#   CI keeps deterministic Python fallbacks and does not require authentication.

# Phase 4 topology: 8 specialized agents (refactored from 5)
# Legacy names (blue-team, quality) still work via AGENT_ALIASES in agent_runner.py
agents:
  intel:
    schedule: "daily"
    model: null                    # Codex CLI built-in default
    max_reports: 5
    max_tokens_estimate: 50000
    web_search: true               # Enable web search when Codex CLI available
    web_search_max_reports: 3      # Max reports to fetch per run
    llm_tasks:
      - "Select and analyze threat reports fetched by Python"
      - "Extract MITRE techniques from raw report summaries"

  red-team:
    trigger: "intel_merge"
    model: null                    # Codex CLI built-in default
    max_scenarios_per_run: 5
    max_tokens_estimate: 30000

  author:
    trigger: "red_merge"
    model: null                    # Codex CLI built-in default
    max_detections_per_run: 5
    max_tokens_estimate: 80000
    llm_tasks:
      - "Author Sigma detection rules from attack/benign event data"

  validation:
    trigger: "author_merge"
    model: null                    # Codex CLI built-in default
    max_tokens_estimate: 30000
    auto_deploy_threshold: 0.90
    max_tune_retries: 2
    refinement_timeout_seconds: 300
    llm_tasks:
      - "Suggest rule improvements when F1 < threshold"

  deployment:
    trigger: "validation_merge OR manual"
    model: null                    # Codex CLI built-in default
    max_tokens_estimate: 10000

  tuning:
    schedule: "daily"
    model: null                    # Codex CLI built-in default
    max_tokens_estimate: 40000
    max_exclusions_per_rule: 3
    llm_tasks:
      - "Analyze fleet health and recommend tuning actions"

  coverage:
    schedule: "daily"
    model: null                    # Codex CLI built-in default
    max_tokens_estimate: 20000

  security:
    trigger: "every_agent_pr"
    model: null                    # Codex CLI built-in default
    max_tokens_estimate: 20000
    block_on_critical: true
    auto_fix_enabled: true
    create_pr: false               # Output is PR review comment, not mergeable content
    scan_patterns_file: "autonomous/security/scan-patterns.yml"

# Infrastructure endpoints
infrastructure:
  elasticsearch:
    url: "http://localhost:9200"
    user: "elastic"
    pass: "changeme"
  kibana:
    url: "http://localhost:5601"
  splunk:
    url: "https://localhost:8089"
    user: "admin"
    pass: "BlueTeamLab1!"
  cribl:
    url: "http://localhost:9000"
    user: "admin"
    pass: "admin"
    hec_url: "http://localhost:8088"
    hec_token: "blue-team-lab-hec-token"
    pipeline: "cim_normalize"

# GitHub
github:
  repo: "dollce/ai-detection-engineering"
  base_branch: "master"

# Local budget heuristics (not Codex subscription quota or API pricing)
budget:
  log_file: "autonomous/budget-log.jsonl"
  daily_cap_tokens: 500000
  warn_at_pct: 80
  default_model_multiplier: 1.0
  models: {}                      # Optional model ID -> estimate multiplier
  light_mode:
    intel_max_reports: 2
    blue_max_detections: 2
    quality_skip_research: true
