events {}
http {
    # The lab records only the exact observable conditions of the AWS custom
    # rule. It never logs raw request bodies, cookie values, or PoC output.
    map $http_cookie $session_cookie_key {
        default 0;
        "~(^|;[[:space:]]*)PHPSESSID=" 1;
    }
    map $request_body $body_observed {
        default 1;
        "" 0;
    }
    map $request_body $session_body_token {
        default 0;
        ~PHPSESSID 1;
    }
    map $request_body $progress_body_token {
        default 0;
        ~PHP_SESSION_UPLOAD_PROGRESS 1;
    }

    log_format php2shell escape=json
        '{"request_id":"$request_id","time":"$time_iso8601",'
        '"method":"$request_method","uri":"$uri",'
        '"content_type":"$http_content_type","status":"$status",'
        '"upstream_status":"$upstream_status",'
        '"request_length":"$request_length",'
        '"body_observed":"$body_observed",'
        '"session_cookie_key":"$session_cookie_key",'
        '"session_body_token":"$session_body_token",'
        '"progress_body_token":"$progress_body_token"}';
    access_log /dev/stdout php2shell;
    error_log /dev/stderr warn;

    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_in_single_buffer on;
    client_header_buffer_size 64k;
    large_client_header_buffers 16 64k;

    server {
        listen 80;
        server_name _;
        add_header X-E2E-Request-ID $request_id always;
        location / {
            proxy_pass http://php:8000;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
        }
    }
}
