title: Data from Network Shared Drive [T1039]
id: f6216724-81d3-454c-94aa-c61085df61ba
status: experimental
description: 'Detects data from network shared drive. Detection should focus on the combination of (1) non-standard process
  path under C:\ProgramData\WindowsUpdate\ initiating SMB (port 445) connections and (2) file writes to non-standard staging
  directories under ProgramData. Benign SMB access and file copies by robocopy.exe or Explorer from expected system paths
  should be excluded. High-value signal: process.executable matching *\ProgramData\WindowsUpdate\* AND destination.port ==
  445 AND file.path matching *\ProgramData\*\staging\*.'
author: author-agent
date: '2026-04-12'
modified: '2026-04-12'
references:
- https://attack.mitre.org/techniques/T1039/
tags:
- attack.execution
- attack.t1039
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    event.code: '1'
    process.executable|contains: sync_agent.exe
    file.path: C:\ProgramData\WindowsUpdate\staging\Q1_2026_Revenue_Projections.xlsx
    destination.port: '445'
    network.transport: tcp
  condition: selection and not filter_legitimate
  filter_legitimate:
    process.name:
    - robocopy.exe
falsepositives:
- 'Detection should focus on the combination of (1) non-standard process path under C:\ProgramData\WindowsUpdate\ initiating
  SMB (port 445) connections and (2) file writes to non-standard staging directories under ProgramData. Benign SMB access
  and file copies by robocopy.exe or Explorer from expected system paths should be excluded. High-value signal: process.executable
  matching *\ProgramData\WindowsUpdate\* AND destination.port == 445 AND file.path matching *\ProgramData\*\staging\*.'
level: high
