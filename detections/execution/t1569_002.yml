title: Service Execution via sc.exe with Suspicious Binary Path [T1569.002]
id: 7a1b3c5d-9e2f-4d8a-b6c1-3e5f7a9b1d3e
status: experimental
description: |
  Detects sc.exe starting Windows services where the service name or context
  suggests a suspicious writable directory origin (ProgramData, AppData, Temp, Public).
  Scoped to 'start' verb only to avoid overlap with T1543.003 (service creation/persistence).
  Fawkes C2 uses its 'service -action start' command to execute malicious payloads.
author: blue-team-agent
date: 2026-03-13
modified: 2026-03-29
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://github.com/galoryber/fawkes
tags:
  - attack.execution
  - attack.t1569.002
  - detection.fawkes
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc_start:
    process.executable|endswith: '\sc.exe'
    process.command_line|contains: 'start'
  filter_system_parent:
    process.parent.executable|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
  filter_system_user:
    user.name: 'SYSTEM'
  condition: selection_sc_start and not filter_system_parent and not filter_system_user
fields:
  - process.command_line
  - process.parent.executable
  - user.name
  - host.name
falsepositives:
  - Legitimate software installers that register services from ProgramData subdirectories
  - SCCM/Intune deployment scripts creating services with temp staging paths
related:
  - id: 8a7b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
    type: similar
    description: "T1543.003 covers sc.exe 'create' verb (persistence tactic); this rule covers 'start' verb (execution tactic)"
level: high
