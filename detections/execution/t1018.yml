title: Remote System Discovery via Net or Nltest Spawned from Non-Standard Parent
id: a7f3c2e1-8b4d-4f9a-bc5e-d6e8f1a2b3c4
status: experimental
description: >
  Detects net.exe and nltest.exe used for remote system and domain controller discovery
  when spawned from a non-standard parent process. The Fawkes C2 net-enum command
  executes these utilities from implant processes located in non-system directories
  (e.g., C:\ProgramData\) to enumerate domain-joined hosts and domain controllers.
  Trusted administrative parents such as interactive shells, SCCM, and MMC are filtered
  to reduce noise from routine IT operations while preserving detection of C2-spawned
  enumeration.
author: Detection Engineering Agent
date: 2026-04-12
modified: 2026-04-12
references:
  - https://attack.mitre.org/techniques/T1018/
  - https://github.com/galoryber/fawkes
tags:
  - attack.discovery
  - attack.t1018
  - detection.fawkes
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    process.name|endswith: 'net.exe'
    process.command_line|contains|all:
      - 'view'
      - '/domain'
  selection_nltest:
    process.name|endswith: 'nltest.exe'
    process.command_line|contains: '/dclist'
  filter_trusted_parents:
    process.parent.executable|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\explorer.exe'
      - '\CcmExec.exe'
      - '\svchost.exe'
      - '\mmc.exe'
      - '\conhost.exe'
      - '\wt.exe'
  condition: (selection_net or selection_nltest) and not filter_trusted_parents
falsepositives:
  - IT administrators running net view or nltest interactively from cmd.exe or PowerShell — filtered by parent
  - SCCM client (CcmExec.exe) performing scheduled domain controller discovery — filtered by parent
  - Domain-joined RMM tools or monitoring agents spawning these utilities from non-standard parents; verify parent executable path and signing status
  - Security scanners and vulnerability assessment tools performing domain enumeration
level: medium