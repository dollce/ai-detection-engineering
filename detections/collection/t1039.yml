title: Non-Standard Process Accessing Network Share for Collection
id: d71eecff-046a-4e3a-ad8b-46e1ac73e11d
status: experimental
description: >
  Detects processes executing from non-standard paths (ProgramData or AppData subdirectories)
  with UNC network share paths in their command-line arguments, indicating collection activity
  from network file shares. The Fawkes C2 agent uses the net-shares capability to stage data
  from UNC share paths (\\server\share) to local staging directories under ProgramData for
  later exfiltration. Legitimate share access tools (robocopy.exe, xcopy.exe, net.exe) execute
  from System32 or Program Files, not from implant paths under ProgramData or AppData.
author: Detection Engineering Agent
date: 2026-04-12
modified: 2026-04-12
references:
  - https://attack.mitre.org/techniques/T1039/
  - https://github.com/galoryber/fawkes
tags:
  - attack.collection
  - attack.t1039
  - detection.fawkes
logsource:
  category: process_creation
  product: windows
detection:
  selection_suspicious_process:
    process.executable|contains:
      - '\ProgramData\'
      - '\AppData\Local\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
  selection_share_collection:
    process.command_line|contains:
      - '--collect'
      - '--out'
      - '--sync'
      - '--copy'
  filter_windows_system:
    process.executable|contains:
      - '\ProgramData\Microsoft\'
      - '\ProgramData\Windows\'
  condition: selection_suspicious_process and selection_share_collection and not filter_windows_system
falsepositives:
  - Custom backup or synchronization agents legitimately installed under ProgramData by IT with collection-style CLI flags
  - Software deployment tools running scripts from ProgramData with copy/sync arguments
level: high
fields:
  - process.name
  - process.executable
  - process.command_line
  - process.parent.name
  - process.parent.executable
  - user.name
