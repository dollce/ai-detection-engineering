title: Process Injection - Suspicious Process Handle or Remote Thread Creation
id: 9b4d2a3f-5c6e-7f8a-9b0c-1d2e3f4a5b6c
status: experimental
description: |
  Detects suspicious process handle acquisition with full access rights (Sysmon EID 10)
  or remote thread creation (Sysmon EID 8) by non-system processes. Matches Fawkes
  vanilla-injection and apc-injection commands which use VirtualAllocEx/WriteProcessMemory/
  CreateRemoteThread and QueueUserAPC respectively.
references:
  - https://attack.mitre.org/techniques/T1055/001/
  - https://attack.mitre.org/techniques/T1055/004/
  - https://github.com/galoryber/fawkes
author: blue-team-agent
date: 2026/03/15
modified: 2026/04/12
tags:
  - attack.privilege_escalation
  - attack.t1055.001
  - attack.t1055.004
  - detection.fawkes
logsource:
  product: windows
  service: sysmon
detection:
  selection_eid10:
    event.code: '10'
    winlog.event_data.GrantedAccess:
      - '0x1F0FFF'
      - '0x1F3FFF'
      - '0x001F0FFF'
      - '0x143A'
      - '0x40'
      - '0x1410'
  selection_eid8:
    event.code: '8'
  filter_trusted:
    process.executable|endswith:
      - '\MsMpEng.exe'
      - '\csrss.exe'
      - '\svchost.exe'
      - '\lsass.exe'
      - '\WerFault.exe'
      - '\SearchIndexer.exe'
      - '\WUDFHost.exe'
  condition: (selection_eid10 or selection_eid8) and not filter_trusted
falsepositives:
  - Security software (EDR, AV) inspecting process memory
  - .NET runtime JIT compilation cross-process activity
  - WMI providers opening handles to managed processes
  - Debuggers attached to processes in development environments
level: critical