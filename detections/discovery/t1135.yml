title: Network Share Enumeration via Net View/Share [T1135]
id: 5bdf2cf9-eb41-45bc-a29a-8169b9b440c9
status: experimental
description: |
  Detects network share enumeration commands (net share, net view, net view \\host)
  used by Fawkes C2 net-shares command and adversary tooling for lateral movement
  reconnaissance. Filters legitimate system and scheduled task contexts.
author: Blue Team Detection Engineering Agent
date: 2026/03/29
modified: 2026/03/29
references:
  - https://attack.mitre.org/techniques/T1135/
  - https://github.com/galoryber/fawkes
tags:
  - attack.discovery
  - attack.t1135
  - detection.fawkes
logsource:
  category: process_creation
  product: windows
detection:
  selection_net_share:
    process.name:
      - 'net.exe'
      - 'net1.exe'
    process.command_line|contains: 'share'
  selection_net_view:
    process.name:
      - 'net.exe'
      - 'net1.exe'
    process.command_line|contains: 'view'
  filter_parent_system:
    process.parent.executable|startswith:
      - 'C:\Windows\System32\svchost.exe'
      - 'C:\Windows\System32\services.exe'
    user.name: 'SYSTEM'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
  - Legitimate IT scripts enumerating shares for inventory
  - Backup software discovering available shares
  - Network management tools
level: medium
