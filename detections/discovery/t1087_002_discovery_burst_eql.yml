title: Rapid Reconnaissance Command Burst
id: 8a3c1f2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
status: experimental
description: |
  Detects execution of common post-exploitation reconnaissance commands typical of
  automated C2 post-exploitation enumeration. Covers Fawkes ps, whoami, net-enum,
  net-stat, arp, and ifconfig capabilities. Excludes executions spawned directly by
  standard interactive Windows shells (cmd.exe, powershell.exe, explorer.exe from
  system paths) to reduce false positives from interactive admin sessions.
  Use threshold alerting (3+ hits per host per 60 s) in the SIEM to recreate the
  burst condition; the rule itself matches each individual discovery-tool launch so
  it compiles cleanly to Lucene.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://github.com/galoryber/fawkes
author: blue-team-agent
date: 2026/03/15
modified: 2026/04/12
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1082
  - attack.t1049
  - detection.fawkes
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    event.code: '1'
    process.name:
      - 'whoami.exe'
      - 'net.exe'
      - 'net1.exe'
      - 'ipconfig.exe'
      - 'systeminfo.exe'
      - 'tasklist.exe'
      - 'nltest.exe'
      - 'netstat.exe'
      - 'arp.exe'
      - 'nslookup.exe'
  filter_main_interactive_shell:
    process.parent.name:
      - 'cmd.exe'
      - 'powershell.exe'
      - 'pwsh.exe'
      - 'explorer.exe'
    process.parent.executable|contains:
      - '\Windows\System32\'
      - '\Windows\SysWOW64\'
      - '\Windows\explorer.exe'
  condition: selection and not filter_main_interactive_shell
falsepositives:
  - IT inventory or audit scripts running from non-standard parent processes
  - Monitoring agents collecting system health data spawning discovery tools directly
  - Security scanners performing host discovery from non-standard executable paths
level: high